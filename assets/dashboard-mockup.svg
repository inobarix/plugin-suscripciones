<svg viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mockupTitle">
  <title id="mockupTitle">Panel Inobarix mostrando métricas de suscripciones activas y pagos recurrentes</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2A44"/>
      <stop offset="100%" stop-color="#123A61"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <rect width="560" height="440" rx="20" fill="url(#bgGrad)"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="512" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="46" cy="46" r="6" fill="#FF7A29"/>
  <circle cx="66" cy="46" r="6" fill="#00C896"/>
  <circle cx="86" cy="46" r="6" fill="#00B4D8"/>
  <rect x="380" y="36" width="140" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Sidebar -->
  <rect x="24" y="84" width="120" height="332" rx="10" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="40" y="104" width="88" height="10" rx="5" fill="#00B4D8" fill-opacity="0.8"/>
  <rect x="40" y="132" width="88" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="40" y="160" width="88" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="40" y="188" width="88" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="40" y="216" width="88" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- KPI cards -->
  <rect x="160" y="84" width="112" height="88" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="176" y="114" fill="#B7C6D6" font-family="Inter, Arial, sans-serif" font-size="11">Suscripciones activas</text>
  <text x="176" y="148" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">1.284</text>

  <rect x="284" y="84" width="112" height="88" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="300" y="114" fill="#B7C6D6" font-family="Inter, Arial, sans-serif" font-size="11">Cobros del mes</text>
  <text x="300" y="148" fill="#00C896" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">$2.4M</text>

  <rect x="408" y="84" width="128" height="88" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="424" y="114" fill="#B7C6D6" font-family="Inter, Arial, sans-serif" font-size="11">Tasa de éxito</text>
  <text x="424" y="148" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">98,6%</text>

  <!-- Chart panel -->
  <rect x="160" y="188" width="376" height="150" rx="12" fill="#FFFFFF" fill-opacity="0.06"/>
  <g>
    <rect x="184" y="270" width="24" height="48" rx="4" fill="url(#barGrad)"/>
    <rect x="222" y="250" width="24" height="68" rx="4" fill="url(#barGrad)"/>
    <rect x="260" y="230" width="24" height="88" rx="4" fill="url(#barGrad)"/>
    <rect x="298" y="210" width="24" height="108" rx="4" fill="url(#barGrad)"/>
    <rect x="336" y="222" width="24" height="96" rx="4" fill="url(#barGrad)"/>
    <rect x="374" y="200" width="24" height="118" rx="4" fill="url(#barGrad)"/>
    <rect x="412" y="188" width="24" height="130" rx="4" fill="#00C896"/>
    <rect x="450" y="204" width="24" height="114" rx="4" fill="url(#barGrad)"/>
    <rect x="488" y="216" width="24" height="102" rx="4" fill="url(#barGrad)"/>
  </g>
  <text x="176" y="210" fill="#B7C6D6" font-family="Inter, Arial, sans-serif" font-size="11">Ingresos recurrentes · últimos 9 meses</text>

  <!-- Table rows -->
  <rect x="160" y="354" width="376" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="182" cy="374" r="6" fill="#00C896"/>
  <text x="198" y="378" fill="#E6EEF5" font-family="Inter, Arial, sans-serif" font-size="12">Plan Mensual Club — próximo cobro OK</text>
  <circle cx="182" cy="398" r="6" fill="#00B4D8"/>
  <text x="198" y="402" fill="#E6EEF5" font-family="Inter, Arial, sans-serif" font-size="12">Webhook sincronizado hace 2 min</text>
</svg>
